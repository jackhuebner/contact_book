
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Contact Details</title>
</head>

<body>

    <h1>Contact Details</h1>

    <h2 th:text="${contact.fullName}">Contact Name</h2>

    <p>
        <strong>Phone Number:</strong>
        <span th:text="${contact.phoneNumber ?: 'Not provided'}"></span>
    </p>

    <p>
        <strong>Email:</strong>
        <span th:text="${contact.email ?: 'Not provided'}"></span>
    </p>

    <p>
        <strong>Address:</strong>
        <span th:text="${contact.address ?: 'Not provided'}"></span>
    </p>

    <p>
        <strong>Notes:</strong>
        <span th:text="${contact.notes ?: 'No additional notes'}"></span>
    </p>

    <br>

    <a th:href="@{/contacts/{id}/edit(id=${contact.id})}">
        <button type="button">Edit Contact</button>
    </a>

    <form th:action="@{/contacts/{id}/delete(id=${contact.id})}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this contact?');">

        <button type="submit">Delete Contact</button>

    </form>

    <br>

    <a th:href="@{/}">Back to Contacts</a>

</body>

</html>
