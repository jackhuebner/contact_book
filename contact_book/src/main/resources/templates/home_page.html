<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
<link rel="stylesheet" type="text/css" href = "home_page-stylesheet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=call" />
</head>

<body style = "background-color: lightyellow;">
  <input type="checkbox" id="menu-toggle">
  <label for="menu-toggle" class="toggle">
    <span class = "top_line common"></span>
    <span class = "mid_line common"></span>
    <span class = "bottom_line common"></span>
  </label>

<div class="sidenav">
  <h1> MENU </h1>
  <a href="#">My Contacts</a>
  <a href="#">Favorites</a>
  <a href="#">Settings</a>
</div>

<div class="main">
    <h1>My Contact Book</h1>
  
    <p>Welcome to your contact book!</p>

    <div style=" display:flex; align-items: center;gap:15px; margin-bottom:15px;">
    <h2 style = "margin: 0">My Contacts</h2>
      <a th:href="@{/add-contact}">
        <button type="button">Add New Contact</button>
      </a>
    </div>



    <form>
      <div class="search">
          <input class="search-input" type="search" placeholder ="Search contact...">
      </div>
    </form>
    <div style=" display:flex; align-items: center; gap:15px; margin-top: 15px;" >
      <button class="filter">All Contacts</button>
      <button class="filter">Favorites</button>
    </div>


    <ul style = "list-style-type:none; padding:0;">

        <li class = "contact" th:each="contact : ${contacts}" style="margin-bottom:10px">
          <div style = " display:flex; align-items:center;"> 
          <div th:text="${contact.phoneNumber}"></div>
          <div class = "image-container" >
          <img th:src="${contact.profilePic}"></img>
          </div>
            <a th:href="@{/contacts/{id}(id=${contact.id})}"
               th:text="${contact.fullName}"
               style = "padding-left: 20px;">
            </a>
          </div>
          <span class="material-symbols-outlined" style = "margin-left:auto; padding-right:10px">call</span>          

      </li>
    </ul>
</div>
</body>

</html>
